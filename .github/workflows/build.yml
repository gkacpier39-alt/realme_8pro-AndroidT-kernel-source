name: Build KernelSU-Next for Realme 8 Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    # Bypassing actions/checkout completely to prevent Git network crashes
    - name: Download Kernel Source and KernelSU-Next via ZIP
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev libncurses-dev rsync zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

        # 1. Download and extract your Realme kernel source code zip
        curl -LO https://github.com
        unzip -q master.zip
        mv realme_8pro-AndroidT-kernel-source-master kernel-source
        rm master.zip

        # 2. Download and extract the KernelSU-Next zip
        curl -LO https://github.com
        unzip -q next.zip
        mkdir -p kernel-source/drivers/kernelsu
        cp -r KernelSU-Next-next/kernel/* kernel-source/drivers/kernelsu/
        rm -rf next.zip KernelSU-Next-next

    - name: Integrate KernelSU-Next Manually
      run: |
        cd kernel-source
        echo "obj-y += kernelsu/" >> drivers/Makefile
        
        # Automatically find the target defconfig file
        CONF_FILE=$(find arch/arm64/configs/ -name "*quark*" -o -name "*user*" -o -name "*defconfig*" | head -n 1)
        echo "Modifying config file: $CONF_FILE"
        
        echo "CONFIG_KPROBES=y" >> "$CONF_FILE"
        echo "CONFIG_HAVE_KPROBES=y" >> "$CONF_FILE"
        echo "CONFIG_KPROBE_EVENTS=y" >> "$CONF_FILE"
        
        echo "DEFCONFIG_NAME=$(basename $CONF_FILE)" >> $GITHUB_ENV

    - name: Compile Kernel
      run: |
        cd kernel-source
        export ARCH=arm64
        export SUBARCH=arm64
        make O=out "$DEFCONFIG_NAME"
        make -j$(nproc) O=out CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Package with AnyKernel3
      run: |
        # Download AnyKernel3 template via zip to keep it secure and fast
        curl -LO https://github.com
        unzip -q master.zip
        mv AnyKernel3-master AnyKernel3
        rm master.zip
        
        cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp kernel-source/out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        zip -r ../KernelSU-Next-Realme8Pro.zip *

    - name: Upload Flashable Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-Next-Zip
        path: KernelSU-Next-Realme8Pro.zip
