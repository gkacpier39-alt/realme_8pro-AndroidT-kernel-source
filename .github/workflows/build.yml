name: Build KernelSU-Next for Realme 8 Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Clean Environment and Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev libncurses-dev rsync git ccache zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Fetch Kernel Source and KernelSU-Next
      run: |
        # Explicitly clone only the final snapshot of the master branch to prevent timeouts
        git clone --branch master --depth=1 https://github.com kernel-source

        # Securely fetch KernelSU-Next files
        git clone --branch next --depth=1 https://github.com ksunext
        mkdir -p kernel-source/drivers/kernelsu
        cp -r ksunext/kernel/* kernel-source/drivers/kernelsu/
        rm -rf ksunext

    - name: Integrate KernelSU-Next Manually
      run: |
        cd kernel-source
        echo "obj-y += kernelsu/" >> drivers/Makefile
        
        # Automatically locate the target defconfig layout profile file
        CONF_FILE=$(find arch/arm64/configs/ -name "*defconfig*" | head -n 1)
        echo "Modifying config file: $CONF_FILE"
        
        echo "CONFIG_KPROBES=y" >> "$CONF_FILE"
        echo "CONFIG_HAVE_KPROBES=y" >> "$CONF_FILE"
        echo "CONFIG_KPROBE_EVENTS=y" >> "$CONF_FILE"
        
        echo "DEFCONFIG_NAME=$(basename $CONF_FILE)" >> $GITHUB_ENV

    - name: Compile Kernel
      run: |
        cd kernel-source
        export ARCH=arm64
        export SUBARCH=arm64
        make O=out "$DEFCONFIG_NAME"
        make -j$(nproc) O=out CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Package with AnyKernel3
      run: |
        git clone --depth=1 https://github.com
        cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp kernel-source/out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        zip -r ../KernelSU-Next-Realme8Pro.zip *

    - name: Upload Flashable Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-Next-Zip
        path: KernelSU-Next-Realme8Pro.zip
