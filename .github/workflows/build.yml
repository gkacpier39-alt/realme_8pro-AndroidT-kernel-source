name: Build KernelSU-Next for Realme 8 Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev libncurses-dev rsync git ccache zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Integrate KernelSU-Next Manually
      run: |
        # Download KernelSU-Next using a dedicated sparse checkout to avoid network breaks
        git clone --depth=1 -b next https://github.com ksunext
        mkdir -p drivers/kernelsu
        cp -r ksunext/kernel/* drivers/kernelsu/
        rm -rf ksunext
        
        # Add to drivers compilation list
        echo "obj-y += kernelsu/" >> drivers/Makefile
        
        # Automatically find the target defconfig file containing 'quark' or 'user'
        CONF_FILE=$(find arch/arm64/configs/ -name "*quark*" -o -name "*defconfig*" | head -n 1)
        echo "Modifying found config file: $CONF_FILE"
        
        echo "CONFIG_KPROBES=y" >> "$CONF_FILE"
        echo "CONFIG_HAVE_KPROBES=y" >> "$CONF_FILE"
        echo "CONFIG_KPROBE_EVENTS=y" >> "$CONF_FILE"
        
        # Save config file name to global environment variable for compilation step
        echo "DEFCONFIG_NAME=$(basename $CONF_FILE)" >> $GITHUB_ENV

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        # Compile using the auto-detected defconfig name saved from the previous step
        make O=out "$DEFCONFIG_NAME"
        make -j$(nproc) O=out CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        zip -r ../KernelSU-Next-Realme8Pro.zip *

    - name: Upload Flashable Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-Next-Zip
        path: KernelSU-Next-Realme8Pro.zip
