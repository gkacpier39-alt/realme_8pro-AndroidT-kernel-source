name: Build KernelSU-Next for Realme 8 Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Download Environment Infrastructure
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev libncurses-dev rsync zip subversion gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

        # 1. Pull down workspace structure using subversion to bypass git size/branch restrictions entirely
        svn export https://github.com kernel-source || svn export https://github.com kernel-source || svn export https://github.com kernel-source

        # 2. Grab KernelSU-Next structures cleanly
        svn export https://github.com kernelsu-next
        mkdir -p kernel-source/drivers/kernelsu
        cp -r kernelsu-next/* kernel-source/drivers/kernelsu/
        rm -rf kernelsu-next

    - name: Integrate KernelSU-Next Manually
      run: |
        cd kernel-source
        echo "obj-y += kernelsu/" >> drivers/Makefile
        
        # Locate the exact compilation configuration file profile dynamically
        CONF_FILE=$(find arch/arm64/configs/ -name "*defconfig*" | head -n 1)
        echo "Modifying found config file: $CONF_FILE"
        
        echo "CONFIG_KPROBES=y" >> "$CONF_FILE"
        echo "CONFIG_HAVE_KPROBES=y" >> "$CONF_FILE"
        echo "CONFIG_KPROBE_EVENTS=y" >> "$CONF_FILE"
        
        echo "DEFCONFIG_NAME=$(basename $CONF_FILE)" >> $GITHUB_ENV

    - name: Compile Kernel
      run: |
        cd kernel-source
        export ARCH=arm64
        export SUBARCH=arm64
        make O=out "$DEFCONFIG_NAME"
        make -j$(nproc) O=out CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Package with AnyKernel3
      run: |
        svn export https://github.com AnyKernel3
        cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp kernel-source/out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        zip -r ../KernelSU-Next-Realme8Pro.zip *

    - name: Upload Flashable Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-Next-Zip
        path: KernelSU-Next-Realme8Pro.zip
