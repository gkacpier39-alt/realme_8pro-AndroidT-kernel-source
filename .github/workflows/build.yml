name: Build KernelSU-Next for Realme 8 Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Run Dedicated Cloud Kernel Compiler Engine
      uses: dabyd64/android-kernel-actions@v1.4
      with:
        kernel-url: https://github.com
        kernel-branch: master
        config: quark_user_defconfig
        arch: arm64
        compiler: gcc
        ksu: false
        extra-cmd: |
          # Manually download and patch KernelSU-Next into the system tree safely
          mkdir -p drivers/kernelsu
          curl -LO https://github.com
          unzip -q next.zip
          cp -r KernelSU-Next-next/kernel/* drivers/kernelsu/
          rm -rf next.zip KernelSU-Next-next
          echo "obj-y += kernelsu/" >> drivers/Makefile
          
          # Inject mandatory configuration requirements directly into target environment profiles
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/vendor/quark_user_defconfig
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/vendor/quark_user_defconfig
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/vendor/quark_user_defconfig
